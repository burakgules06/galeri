# ===================================================================
# UYGULAMA
# Prod degerleri /opt/galeri/.env'den gelir. Lokal gelistirme icin
# "dev" profili ile calistir: SPRING_PROFILES_ACTIVE=dev (bkz. application-dev.properties)
# ===================================================================
spring.application.name=galeriAPP
server.port=${SERVER_PORT:8082}

# ===================================================================
# VERITABANI
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ===================================================================
# JPA / HIBERNATE - semayi Flyway yonetir, Hibernate sadece dogrular
# ===================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ===================================================================
# FLYWAY
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===================================================================
# GUVENLIK
# ===================================================================
# JWT imzalama anahtari: en az 32 karakter. Varsayilan YOK - tanimlanmazsa uygulama acilmaz.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
# Panelin calistigi adresler (virgulle ayrilmis)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===================================================================
# IZLEME (actuator) - prod'da yonetim portu .env ile 127.0.0.1:9093'e alinir
# ===================================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
