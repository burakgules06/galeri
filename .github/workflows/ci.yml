# Her PR'da ve main'e her push'ta derleme + testler.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: galeri
          POSTGRES_USER: galeri_app
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galeri_app -d galeri"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/galeri
      DB_USER: galeri_app
      DB_PASSWORD: ci_password
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - name: Derle ve test et
        run: |
          set +e
          ./mvnw -B verify 2>&1 | tee mvn.log
          exit ${PIPESTATUS[0]}
      # Hata ayrintisi Checks ekraninda (ve API'de) annotation olarak gorunsun: derleme hatasi ve basarisiz testler
      - name: Hatalari ozetle
        if: failure()
        run: |
          grep -E '^\[ERROR\] /.*\.java:\[[0-9]+' mvn.log | head -20 | while IFS= read -r line; do
            echo "::error title=Derleme::${line#\[ERROR\] }"
          done
          # Uygulama acilmadiysa (migration / sema / bean hatasi) asil neden "Caused by" satirlarinda
          grep -hE 'Caused by:' mvn.log target/surefire-reports/*.txt target/failsafe-reports/*.txt 2>/dev/null \
            | sed 's/^[[:space:]]*//' | sort | uniq -c | sort -rn | head -8 | while IFS= read -r line; do
            echo "::error title=Neden::${line:0:900}"
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          n = 0
          for f in sorted(glob.glob('target/surefire-reports/*.xml') + glob.glob('target/failsafe-reports/*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = ((bad.get('message') or '') + ' | ' + (bad.text or '')[:600]).replace('\n', ' ').replace('%', '%25')
                      print(f"::error title={tc.get('classname','').split('.')[-1]}.{tc.get('name')}::{msg[:900]}")
                      n += 1
                      if n >= 25: raise SystemExit
          PY
      - name: Test raporlari
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  panel:
    name: Panel (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
